<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Sous-Titres CapCut Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-6">

    <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-3xl font-extrabold mb-2 text-center bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
            CapCut Web Subtitler
        </h1>
        <p class="text-sm text-slate-400 text-center mb-6">Choisis ton style et génère tes sous-titres automatiques en un clic</p>

        <!-- 1. Upload Vidéo -->
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2 text-purple-400">1. Ta Vidéo</label>
            <input type="file" id="videoFile" accept="video/mp4,video/mov" class="w-full text-sm text-slate-400 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer bg-slate-800/50 rounded-xl border border-slate-700"/>
        </div>

        <!-- 2. Galerie de Styles Visuels (CapCut style) -->
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2 text-purple-400">2. Choisis ton Style de Sous-titre</label>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 max-h-60 overflow-y-auto p-2 bg-slate-950/50 rounded-xl border border-slate-800">
                
                <!-- Style 1 -->
                <label class="relative flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer border-2 border-purple-500 transition">
                    <input type="radio" name="subtitleStyle" value="classic_yellow" class="absolute top-2 right-2" checked>
                    <span class="font-black text-yellow-300 text-lg drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">OUI !</span>
                    <span class="text-xs text-slate-300 mt-1">Jaune Classique</span>
                </label>

                <!-- Style 2 -->
                <label class="relative flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer border-2 border-transparent transition">
                    <input type="radio" name="subtitleStyle" value="neon_green" class="absolute top-2 right-2">
                    <span class="font-extrabold text-emerald-400 text-lg [text-shadow:_0_0_10px_#10b981]">PRO</span>
                    <span class="text-xs text-slate-300 mt-1">Néon Vert</span>
                </label>

                <!-- Style 3 -->
                <label class="relative flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer border-2 border-transparent transition">
                    <input type="radio" name="subtitleStyle" value="tiktok_bold" class="absolute top-2 right-2">
                    <span class="font-black text-white bg-black px-2 py-0.5 rounded text-base">TREND</span>
                    <span class="text-xs text-slate-300 mt-1">TikTok Fond Noir</span>
                </label>

                <!-- Style 4 -->
                <label class="relative flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer border-2 border-transparent transition">
                    <input type="radio" name="subtitleStyle" value="cyber_pink" class="absolute top-2 right-2">
                    <span class="font-black text-pink-500 text-lg drop-shadow-[0_0_8px_#ec4899]">FIRE</span>
                    <span class="text-xs text-slate-300 mt-1">Cyber Rose</span>
                </label>

                <!-- Style 5 -->
                <label class="relative flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer border-2 border-transparent transition">
                    <input type="radio" name="subtitleStyle" value="karaoke_blue" class="absolute top-2 right-2">
                    <span class="font-bold text-cyan-300 text-lg underline decoration-pink-500">BEAST</span>
                    <span class="text-xs text-slate-300 mt-1">Bleu Souligné</span>
                </label>

                <!-- Style 6 -->
                <label class="relative flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer border-2 border-transparent transition">
                    <input type="radio" name="subtitleStyle" value="minimal_white" class="absolute top-2 right-2">
                    <span class="font-medium text-white text-lg">Clean</span>
                    <span class="text-xs text-slate-300 mt-1">Blanc Minimal</span>
                </label>

                <!-- Style 7 -->
                <label class="relative flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer border-2 border-transparent transition">
                    <input type="radio" name="subtitleStyle" value="gamer_red" class="absolute top-2 right-2">
                    <span class="font-black text-red-500 text-lg uppercase italic">Epic</span>
                    <span class="text-xs text-slate-300 mt-1">Gamer Rouge</span>
                </label>

                <!-- Style 8 -->
                <label class="relative flex flex-col items-center justify-center p-3 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer border-2 border-transparent transition">
                    <input type="radio" name="subtitleStyle" value="gradient_orange" class="absolute top-2 right-2">
                    <span class="font-bold text-orange-400 text-lg">BOOM</span>
                    <span class="text-xs text-slate-300 mt-1">Orange Vif</span>
                </label>

            </div>
        </div>

        <!-- Bouton de lancement -->
        <button id="processBtn" class="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 font-bold text-lg rounded-xl transition shadow-lg">
            Générer les sous-titres auto
        </button>

        <div id="status" class="mt-4 text-center text-sm text-purple-400 font-medium"></div>

        <!-- Résultat -->
        <div id="resultContainer" class="mt-6 hidden text-center">
            <video id="outputVideo" controls class="w-full rounded-xl mb-4 border border-slate-800"></video>
            <a id="downloadLink" class="inline-block py-3 px-8 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition">
                Télécharger la vidéo
            </a>
        </div>
    </div>

    <script>
        const processBtn = document.getElementById('processBtn');
        const status = document.getElementById('status');
        const videoInput = document.getElementById('videoFile');
        const resultContainer = document.getElementById('resultContainer');

        processBtn.addEventListener('click', () => {
            if (!videoInput.files[0]) {
                alert("Sélectionne une vidéo d'abord !");
                return;
            }
            const selectedStyle = document.querySelector('input[name="subtitleStyle"]:checked').value;
            status.textContent = `Style sélectionné : ${selectedStyle}. Connexion au moteur de rendu...`;
            // Ici on branchera l'appel vers ton API de traitement Python distante
        });
    </script>
</body>
</html>
