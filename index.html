<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubtiFlow — Éditeur de sous-titres</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0b0d12;
  --panel: #12151c;
  --panel2: #181c25;
  --border: #292f3b;
  --text: #f5f7fa;
  --muted: #9299a8;
  --accent: #7c5cff;
  --accent2: #6243e8;
}

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
  background: #0d1016;
}

.logo {
  font-size: 21px;
  font-weight: 800;
}

.logo span {
  color: var(--accent);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.btn {
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 14px;
}

.btn:hover {
  background: #202531;
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
}

.btn.primary:hover {
  background: var(--accent2);
}

.main {
  flex: 1;
  display: grid;
  grid-template-columns: 270px minmax(400px, 1fr) 330px;
  min-height: calc(100vh - 64px);
}

.sidebar {
  border-right: 1px solid var(--border);
  background: var(--panel);
  padding: 16px;
  overflow-y: auto;
}

.rightbar {
  border-left: 1px solid var(--border);
  background: var(--panel);
  padding: 16px;
  overflow-y: auto;
}

.workspace {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.dropzone {
  margin: 18px;
  min-height: 130px;
  border: 2px dashed #3a4150;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: .2s;
}

.dropzone.dragover {
  border-color: var(--accent);
  background: rgba(124,92,255,.08);
}

.dropzone strong {
  color: var(--text);
  margin-bottom: 8px;
}

.video-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  min-height: 420px;
}

.preview {
  position: relative;
  width: min(900px, 100%);
  max-height: 65vh;
  aspect-ratio: 16 / 9;
  background: #050608;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 15px 50px rgba(0,0,0,.45);
}

#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.subtitle-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.subtitle {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  text-align: center;
  white-space: pre-wrap;
  word-break: break-word;
  color: white;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.15;
  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    2px -2px 0 #000,
    -2px 2px 0 #000;
}

.subtitle.top {
  top: 7%;
}

.subtitle.center {
  top: 50%;
  transform: translate(-50%, -50%);
}

.subtitle.bottom {
  bottom: 8%;
}

.subtitle.bottom-left {
  left: 8%;
  transform: none;
  bottom: 8%;
  text-align: left;
}

.subtitle.bottom-right {
  left: auto;
  right: 8%;
  transform: none;
  bottom: 8%;
  text-align: right;
}

.controls {
  border-top: 1px solid var(--border);
  padding: 12px 18px;
  background: #0e1117;
}

.control-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

input[type="range"] {
  width: 100%;
}

.time {
  color: var(--muted);
  font-size: 13px;
  min-width: 100px;
}

.section {
  margin-bottom: 22px;
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 10px;
}

.field {
  margin-bottom: 12px;
}

.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid var(--border);
  background: #0d1016;
  color: var(--text);
  border-radius: 8px;
  padding: 9px;
  outline: none;
}

.field textarea {
  min-height: 80px;
  resize: vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--accent);
}

.style-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.style-card {
  min-height: 54px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #0d1016;
  color: white;
  padding: 8px;
  font-size: 12px;
}

.style-card.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.segments {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.segment {
  border: 1px solid var(--border);
  background: #0e1117;
  border-radius: 9px;
  padding: 10px;
  cursor: pointer;
}

.segment.active {
  border-color: var(--accent);
  background: rgba(124,92,255,.08);
}

.segment-time {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}

.segment-text {
  font-size: 13px;
}

.segment-actions {
  display: flex;
  gap: 5px;
  margin-top: 8px;
}

.small {
  font-size: 11px;
  padding: 5px 8px;
}

.progress {
  width: 100%;
  height: 7px;
  border-radius: 10px;
  background: #252a34;
  overflow: hidden;
  margin-top: 8px;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: var(--accent);
  transition: width .2s;
}

.status {
  font-size: 12px;
  color: var(--muted);
  margin-top: 7px;
}

.hidden {
  display: none !important;
}

.filter-preview {
  filter: none;
}

@media(max-width:1100px) {
  .main {
    grid-template-columns: 220px minmax(350px,1fr);
  }

  .rightbar {
    display: none;
  }
}

@media(max-width:750px) {
  .main {
    display: block;
  }

  .sidebar {
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .video-area {
    min-height: 300px;
  }

  .preview {
    width: 100%;
  }

  header {
    padding: 0 12px;
  }

  .header-actions .btn:not(.primary) {
    display: none;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">Subti<span>Flow</span></div>

  <div class="header-actions">
    <button class="btn" id="newProject">Nouveau</button>
    <button class="btn" id="exportSrt">SRT</button>
    <button class="btn" id="exportVtt">VTT</button>
    <button class="btn primary" id="exportText">Exporter texte</button>
  </div>
</header>

<div class="main">

<aside class="sidebar">

  <div class="section">
    <div class="section-title">Vidéo</div>

    <button class="btn primary" style="width:100%" id="chooseVideo">
      Importer une vidéo
    </button>

    <input
      id="fileInput"
      type="file"
      accept="video/*"
      class="hidden"
    >

    <div class="status" id="fileInfo">
      Aucune vidéo
    </div>
  </div>

  <div class="section">

    <div class="section-title">
      Sous-titres
    </div>

    <button
      class="btn primary"
      style="width:100%"
      id="transcribe"
    >
      🎙 Générer les sous-titres
    </button>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="transcriptionStatus">
      Prêt
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      Segments
    </div>

    <div id="segments" class="segments"></div>

    <button
      class="btn"
      style="width:100%;margin-top:10px"
      id="addSegment"
    >
      + Ajouter un sous-titre
    </button>

  </div>

</aside>

<main class="workspace">

  <div
    class="dropzone"
    id="dropzone"
  >
    <strong>Dépose ta vidéo ici</strong>
    <span>MP4, WebM, MOV...</span>
  </div>

  <div class="video-area">

    <div class="preview">

      <video
        id="video"
        class="filter-preview"
        playsinline
        controls
      ></video>

      <div class="subtitle-layer">
        <div
          id="subtitle"
          class="subtitle bottom"
        ></div>
      </div>

    </div>

  </div>

  <div class="controls">

    <div class="control-row">

      <button class="btn" id="playPause">
        ▶
      </button>

      <span class="time" id="time">
        00:00 / 00:00
      </span>

      <input
        type="range"
        id="seek"
        min="0"
        max="100"
        value="0"
      >

    </div>

  </div>

</main>

<aside class="rightbar">

  <div class="section">

    <div class="section-title">
      Texte sélectionné
    </div>

    <div class="field">

      <label>Texte</label>

      <textarea
        id="editText"
        placeholder="Sélectionne un sous-titre..."
      ></textarea>

    </div>

    <div style="display:flex;gap:7px">

      <div class="field" style="flex:1">
        <label>Début</label>
        <input id="editStart" type="number" step="0.1">
      </div>

      <div class="field" style="flex:1">
        <label>Fin</label>
        <input id="editEnd" type="number" step="0.1">
      </div>

    </div>

    <button
      class="btn primary"
      style="width:100%"
      id="saveSegment"
    >
      Enregistrer
    </button>

  </div>

  <div class="section">

    <div class="section-title">
      Styles
    </div>

    <div class="style-grid" id="styleGrid"></div>

  </div>

  <div class="section">

    <div class="section-title">
      Apparence
    </div>

    <div class="field">

      <label>Couleur</label>

      <input
        id="textColor"
        type="color"
        value="#ffffff"
      >

    </div>

    <div class="field">

      <label>Taille</label>

      <input
        id="fontSize"
        type="range"
        min="12"
        max="80"
        value="32"
      >

    </div>

    <div class="field">

      <label>Position</label>

      <select id="position">
        <option value="top">Haut</option>
        <option value="center">Centre</option>
        <option value="bottom" selected>Bas</option>
        <option value="bottom-left">Bas gauche</option>
        <option value="bottom-right">Bas droite</option>
      </select>

    </div>

    <div class="field">

      <label>Police</label>

      <select id="fontFamily">

        <option value="Arial">Arial</option>
        <option value="Inter">Inter</option>
        <option value="Georgia">Georgia</option>
        <option value="Verdana">Verdana</option>
        <option value="Impact">Impact</option>
        <option value="Trebuchet MS">Trebuchet MS</option>

      </select>

    </div>

    <div class="field">

      <label>Épaisseur</label>

      <select id="fontWeight">

        <option value="400">Normal</option>
        <option value="600">Semi-gras</option>
        <option value="700" selected>Gras</option>
        <option value="900">Très gras</option>

      </select>

    </div>

  </div>

  <div class="section">

    <div class="section-title">
      Filtre vidéo
    </div>

    <select id="filter" style="
      width:100%;
      background:#0d1016;
      color:white;
      border:1px solid #292f3b;
      padding:9px;
      border-radius:8px;
    ">

      <option value="none">Normal</option>
      <option value="grayscale(1)">Noir et blanc</option>
      <option value="sepia(1)">Sépia</option>
      <option value="contrast(1.3)">Contraste</option>
      <option value="brightness(1.2)">Lumineux</option>
      <option value="saturate(1.6)">Vif</option>
      <option value="saturate(.5)">Désaturé</option>
      <option value="hue-rotate(25deg)">Chaud</option>
      <option value="hue-rotate(190deg)">Froid</option>
      <option value="grayscale(.5) contrast(1.2)">Cinéma</option>

    </select>

  </div>

</aside>

</div>
</div>

<script>

"use strict";

/* =========================================================
   ÉTAT DE L'APPLICATION
========================================================= */

const state = {

  videoUrl: null,

  segments: [],

  selectedSegment: -1,

  style: "classic",

  appearance: {
    color: "#ffffff",
    fontSize: 32,
    position: "bottom",
    fontFamily: "Arial",
    fontWeight: "700"
  }

};


/* =========================================================
   ÉLÉMENTS DOM
========================================================= */

const video =
  document.getElementById("video");

const fileInput =
  document.getElementById("fileInput");

const chooseVideo =
  document.getElementById("chooseVideo");

const dropzone =
  document.getElementById("dropzone");

const fileInfo =
  document.getElementById("fileInfo");

const segmentsContainer =
  document.getElementById("segments");

const subtitle =
  document.getElementById("subtitle");

const editText =
  document.getElementById("editText");

const editStart =
  document.getElementById("editStart");

const editEnd =
  document.getElementById("editEnd");

const styleGrid =
  document.getElementById("styleGrid");

const progressBar =
  document.getElementById("progressBar");

const transcriptionStatus =
  document.getElementById("transcriptionStatus");

const seek =
  document.getElementById("seek");

const time =
  document.getElementById("time");


/* =========================================================
   STYLES
========================================================= */

const styles = {

  classic: {
    name: "Classique",
    color: "#ffffff",
    background: "transparent",
    shadow: "2px 2px 0 #000"
  },

  whiteBox: {
    name: "Boîte blanche",
    color: "#111111",
    background: "#ffffff",
    shadow: "none"
  },

  blackBox: {
    name: "Boîte noire",
    color: "#ffffff",
    background: "#000000",
    shadow: "none"
  },

  yellow: {
    name: "Jaune",
    color: "#ffe600",
    background: "transparent",
    shadow: "2px 2px 0 #000"
  },

  cyan: {
    name: "Cyan",
    color: "#00e5ff",
    background: "transparent",
    shadow: "2px 2px 0 #000"
  },

  pink: {
    name: "Rose",
    color: "#ff4fd8",
    background: "transparent",
    shadow: "2px 2px 0 #000"
  },

  neon: {
    name: "Néon",
    color: "#ffffff",
    background: "transparent",
    shadow: "0 0 12px #7c5cff"
  },

  gaming: {
    name: "Gaming",
    color: "#7cff00",
    background: "#111",
    shadow: "3px 3px 0 #000"
  },

  cinema: {
    name: "Cinéma",
    color: "#fff",
    background: "rgba(0,0,0,.65)",
    shadow: "none"
  },

  minimal: {
    name: "Minimal",
    color: "#fff",
    background: "transparent",
    shadow: "none"
  },

  bold: {
    name: "Bold",
    color: "#fff",
    background: "transparent",
    shadow: "3px 3px 0 #000"
  },

  elegant: {
    name: "Élégant",
    color: "#f5d99b",
    background: "transparent",
    shadow: "1px 1px 3px #000"
  },

  retro: {
    name: "Retro",
    color: "#ffcc66",
    background: "#502f1f",
    shadow: "2px 2px 0 #000"
  },

  cartoon: {
    name: "Cartoon",
    color: "#fff",
    background: "#ff3b30",
    shadow: "4px 4px 0 #000"
  },

  pop: {
    name: "Pop",
    color: "#fff",
    background: "#ff2d75",
    shadow: "3px 3px 0 #000"
  },

  shadow: {
    name: "Shadow",
    color: "#fff",
    background: "transparent",
    shadow: "0 5px 18px #000"
  },

  outline: {
    name: "Contour",
    color: "#fff",
    background: "transparent",
    shadow: "3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000"
  },

  soft: {
    name: "Soft",
    color: "#fff",
    background: "rgba(0,0,0,.35)",
    shadow: "0 2px 8px #000"
  },

  karaoke: {
    name: "Karaoke",
    color: "#00ff7f",
    background: "transparent",
    shadow: "2px 2px 0 #000"
  },

  modern: {
    name: "Moderne",
    color: "#fff",
    background: "rgba(124,92,255,.8)",
    shadow: "none"
  }

};


/* =========================================================
   AFFICHAGE DES STYLES
========================================================= */

function renderStyles() {

  styleGrid.innerHTML = "";

  Object.entries(styles).forEach(
    ([key, value]) => {

      const button =
        document.createElement("button");

      button.className =
        "style-card" +
        (state.style === key ? " active" : "");

      button.textContent =
        value.name;

      button.onclick = () => {

        state.style = key;

        applyAppearance();

        renderStyles();

      };

      styleGrid.appendChild(button);

    }
  );

}

renderStyles();


/* =========================================================
   IMPORTATION
========================================================= */

chooseVideo.onclick = () =>
  fileInput.click();


fileInput.onchange = () => {

  const file =
    fileInput.files[0];

  if (file) {

    loadVideo(file);

  }

};


dropzone.addEventListener(
  "dragover",
  e => {

    e.preventDefault();

    dropzone.classList.add("dragover");

  }
);


dropzone.addEventListener(
  "dragleave",
  () => {

    dropzone.classList.remove("dragover");

  }
);


dropzone.addEventListener(
  "drop",
  e => {

    e.preventDefault();

    dropzone.classList.remove("dragover");

    const file =
      e.dataTransfer.files[0];

    if (
      file &&
      file.type.startsWith("video/")
    ) {

      loadVideo(file);

    }

  }
);


function loadVideo(file) {

  if (state.videoUrl) {

    URL.revokeObjectURL(
      state.videoUrl
    );

  }

  state.videoUrl =
    URL.createObjectURL(file);

  video.src =
    state.videoUrl;

  fileInfo.textContent =
    `${file.name} — ${formatBytes(file.size)}`;

  state.segments = [];

  state.selectedSegment = -1;

  renderSegments();

  subtitle.textContent = "";

}


/* =========================================================
   FORMATAGE
========================================================= */

function formatBytes(bytes) {

  if (!bytes) return "0 B";

  const units =
    ["B","KB","MB","GB"];

  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    bytes /
    Math.pow(1024, i)
  ).toFixed(1)
  + " "
  + units[i];

}


function formatTime(seconds) {

  seconds =
    Math.max(0, Number(seconds) || 0);

  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    Math.floor(seconds % 60);

  const ms =
    Math.floor(
      (seconds % 1) * 1000
    );

  const pad =
    n => String(n).padStart(2, "0");

  if (h > 0) {

    return (
      pad(h) + ":" +
      pad(m) + ":" +
      pad(s)
    );

  }

  return (
    pad(m) + ":" +
    pad(s) + "." +
    String(ms).padStart(3, "0")
  );

}


/* =========================================================
   SEGMENTS
========================================================= */

function renderSegments() {

  segmentsContainer.innerHTML = "";

  state.segments.forEach(
    (segment, index) => {

      const el =
        document.createElement("div");

      el.className =
        "segment" +
        (
          index === state.selectedSegment
            ? " active"
            : ""
        );

      const t =
        document.createElement("div");

      t.className =
        "segment-time";

      t.textContent =
        `${formatTime(segment.start)} → ${formatTime(segment.end)}`;

      const text =
        document.createElement("div");

      text.className =
        "segment-text";

      text.textContent =
        segment.text;

      el.appendChild(t);
      el.appendChild(text);

      el.onclick = () => {

        selectSegment(index);

      };

      segmentsContainer.appendChild(el);

    }
  );

}


function selectSegment(index) {

  state.selectedSegment =
    index;

  const segment =
    state.segments[index];

  if (!segment) return;

  editText.value =
    segment.text;

  editStart.value =
    segment.start;

  editEnd.value =
    segment.end;

  video.currentTime =
    segment.start;

  renderSegments();

}


/* =========================================================
   ENREGISTRER SEGMENT
========================================================= */

document
  .getElementById("saveSegment")
  .onclick = () => {

    const index =
      state.selectedSegment;

    if (index < 0) return;

    const text =
      editText.value.trim();

    const start =
      Number(editStart.value);

    const end =
      Number(editEnd.value);

    if (!text) {

      alert("Le texte ne peut pas être vide.");

      return;

    }

    if (
      !Number.isFinite(start) ||
      !Number.isFinite(end) ||
      end <= start
    ) {

      alert("Les timings sont invalides.");

      return;

    }

    state.segments[index] = {

      text,
      start,
      end

    };

    renderSegments();

    updateSubtitle();

  };


/* =========================================================
   AJOUTER SEGMENT
========================================================= */

document
  .getElementById("addSegment")
  .onclick = () => {

    const current =
      video.currentTime || 0;

    const segment = {

      text: "Nouveau sous-titre",

      start: current,

      end:
        Math.min(
          current + 3,
          video.duration || current + 3
        )

    };

    state.segments.push(segment);

    state.segments.sort(
      (a,b) => a.start - b.start
    );

    renderSegments();

    selectSegment(
      state.segments.indexOf(segment)
    );

  };


/* =========================================================
   SOUS-TITRE ACTIF
========================================================= */

function getCurrentSegment() {

  const t =
    video.currentTime;

  return state.segments.find(
    segment =>
      t >= segment.start &&
      t <= segment.end
  );

}


function updateSubtitle() {

  const segment =
    getCurrentSegment();

  subtitle.textContent =
    segment
      ? segment.text
      : "";

}


/* =========================================================
   APPARENCE
========================================================= */

function applyAppearance() {

  const selected =
    styles[state.style];

  subtitle.style.color =
    state.appearance.color ||
    selected.color;

  subtitle.style.fontSize =
    state.appearance.fontSize +
    "px";

  subtitle.style.fontFamily =
    state.appearance.fontFamily;

  subtitle.style.fontWeight =
    state.appearance.fontWeight;

  subtitle.style.background =
    selected.background;

  subtitle.style.textShadow =
    selected.shadow;

  subtitle.className =
    "subtitle " +
    state.appearance.position;

}


document
  .getElementById("textColor")
  .oninput = e => {

    state.appearance.color =
      e.target.value;

    applyAppearance();

  };


document
  .getElementById("fontSize")
  .oninput = e => {

    state.appearance.fontSize =
      Number(e.target.value);

    applyAppearance();

  };


document
  .getElementById("position")
  .onchange = e => {

    state.appearance.position =
      e.target.value;

    applyAppearance();

  };


document
  .getElementById("fontFamily")
  .onchange = e => {

    state.appearance.fontFamily =
      e.target.value;

    applyAppearance();

  };


document
  .getElementById("fontWeight")
  .onchange = e => {

    state.appearance.fontWeight =
      e.target.value;

    applyAppearance();

  };


/* =========================================================
   FILTRES
========================================================= */

document
  .getElementById("filter")
  .onchange = e => {

    video.style.filter =
      e.target.value;

  };


/* =========================================================
   LECTEUR
========================================================= */

document
  .getElementById("playPause")
  .onclick = () => {

    if (video.paused) {

      video.play();

    } else {

      video.pause();

    }

  };


video.addEventListener(
  "play",
  () => {

    document
      .getElementById("playPause")
      .textContent = "❚❚";

  }
);


video.addEventListener(
  "pause",
  () => {

    document
      .getElementById("playPause")
      .textContent = "▶";

  }
);


video.addEventListener(
  "timeupdate",
  () => {

    updateSubtitle();

    if (video.duration) {

      seek.value =
        (
          video.currentTime /
          video.duration
        ) * 100;

    }

    time.textContent =
      `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;

  }
);


seek.oninput = () => {

  if (!video.duration) return;

  video.currentTime =
    (
      Number(seek.value) /
      100
    ) *
    video.duration;

};


/* =========================================================
   TRANSCRIPTION
========================================================= */

document
  .getElementById("transcribe")
  .onclick = startTranscription;


function startTranscription() {

  if (!video.src) {

    alert("Importe d'abord une vidéo.");

    return;

  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    transcriptionStatus.textContent =
      "La reconnaissance vocale n'est pas disponible dans ce navigateur.";

    alert(
      "La transcription automatique n'est pas disponible dans ce navigateur. Essaie Chrome ou Edge."
    );

    return;

  }

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "fr-FR";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;

  state.segments = [];

  progressBar.style.width =
    "0%";

  transcriptionStatus.textContent =
    "Écoute en cours...";

  let segmentStart = 0;

  let lastText = "";

  let lastResultTime = 0;

  recognition.onresult =
    event => {

      let finalText = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const result =
          event.results[i];

        if (result.isFinal) {

          finalText +=
            result[0].transcript;

        }

      }

      if (!finalText.trim()) return;

      const now =
        video.currentTime;

      const clean =
        finalText
          .replace(/\s+/g, " ")
          .trim();

      if (
        clean &&
        clean !== lastText
      ) {

        state.segments.push({

          text: clean,

          start:
            lastResultTime ||
            Math.max(
              0,
              now - 2
            ),

          end:
            Math.max(
              now,
              (lastResultTime || now) + 1
            )

        });

        lastText =
          clean;

        lastResultTime =
          now;

        renderSegments();

      }

      if (video.duration) {

        progressBar.style.width =
          Math.min(
            100,
            (now /
              video.duration) *
            100
          ) + "%";

      }

    };


  recognition.onerror =
    event => {

      transcriptionStatus.textContent =
        "Erreur : " +
        event.error;

    };


  recognition.onend =
    () => {

      transcriptionStatus.textContent =
        "Transcription terminée.";

      progressBar.style.width =
        "100%";

      state.segments.sort(
        (a,b) =>
          a.start - b.start
      );

      renderSegments();

    };


  /*
    On démarre la vidéo pour que la
    reconnaissance puisse suivre l'audio.
  */

  video.currentTime = 0;

  video.play()
    .catch(() => {});

  recognition.start();

}


/* =========================================================
   EXPORT SRT
========================================================= */

function createSRT() {

  return state.segments
    .map(
      (segment, index) => {

        return (
          `${index + 1}\n` +
          `${formatSRTTime(segment.start)} --> ${formatSRTTime(segment.end)}\n` +
          `${segment.text}\n`
        );

      }
    )
    .join("\n");

}


function formatSRTTime(seconds) {

  const total =
    Math.max(0, seconds);

  const h =
    Math.floor(total / 3600);

  const m =
    Math.floor(
      (total % 3600) / 60
    );

  const s =
    Math.floor(total % 60);

  const ms =
    Math.floor(
      (total % 1) * 1000
    );

  const pad =
    n => String(n).padStart(2,"0");

  return (
    `${pad(h)}:${pad(m)}:${pad(s)},` +
    String(ms).padStart(3,"0")
  );

}


/* =========================================================
   EXPORT VTT
========================================================= */

function createVTT() {

  return (
    "WEBVTT\n\n" +
    state.segments
      .map(
        segment =>
          `${formatVTTTime(segment.start)} --> ${formatVTTTime(segment.end)}\n${segment.text}\n`
      )
      .join("\n")
  );

}


function formatVTTTime(seconds) {

  const total =
    Math.max(0, seconds);

  const h =
    Math.floor(total / 3600);

  const m =
    Math.floor(
      (total % 3600) / 60
    );

  const s =
    Math.floor(total % 60);

  const ms =
    Math.floor(
      (total % 1) * 1000
    );

  const pad =
    n => String(n).padStart(2,"0");

  return (
    `${pad(h)}:${pad(m)}:${pad(s)}.` +
    String(ms).padStart(3,"0")
  );

}


/* =========================================================
   TÉLÉCHARGEMENT
========================================================= */

function downloadFile(
  content,
  filename,
  type
) {

  const blob =
    new Blob(
      [content],
      {type}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );

}


document
  .getElementById("exportSrt")
  .onclick = () => {

    if (!state.segments.length) {

      alert("Aucun sous-titre à exporter.");

      return;

    }

    downloadFile(
      createSRT(),
      "subtitres.srt",
      "text/plain;charset=utf-8"
    );

  };


document
  .getElementById("exportVtt")
  .onclick = () => {

    if (!state.segments.length) {

      alert("Aucun sous-titre à exporter.");

      return;

    }

    downloadFile(
      createVTT(),
      "subtitres.vtt",
      "text/vtt;charset=utf-8"
    );

  };


document
  .getElementById("exportText")
  .onclick = () => {

    if (!state.segments.length) {

      alert("Aucun sous-titre à exporter.");

      return;

    }

    const text =
      state.segments
        .map(s => s.text)
        .join("\n");

    downloadFile(
      text,
      "transcription.txt",
      "text/plain;charset=utf-8"
    );

  };


/* =========================================================
   NOUVEAU PROJET
========================================================= */

document
  .getElementById("newProject")
  .onclick = () => {

    if (
      !confirm(
        "Créer un nouveau projet ?"
      )
    ) return;

    state.segments = [];

    state.selectedSegment = -1;

    if (state.videoUrl) {

      URL.revokeObjectURL(
        state.videoUrl
      );

    }

    state.videoUrl = null;

    video.removeAttribute("src");

    video.load();

    fileInfo.textContent =
      "Aucune vidéo";

    subtitle.textContent =
      "";

    editText.value =
      "";

    editStart.value =
      "";

    editEnd.value =
      "";

    renderSegments();

  };


/* =========================================================
   INITIALISATION
========================================================= */

applyAppearance();

renderSegments();

</script>
