<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubtiFlow - Éditeur de Sous-Titres Interactif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Poppins:wght@700;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-x-hidden">

    <!-- Header -->
    <header class="h-16 border-b border-slate-800/80 flex items-center justify-between px-6 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-pink-600 to-purple-600 rounded-xl flex items-center justify-center font-black text-xl shadow-lg shadow-purple-900/40">
                S
            </div>
            <span class="text-xl font-black bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                SubtiFlow
            </span>
        </div>
        <div class="flex items-center space-x-3">
            <button id="exportBtn" class="flex items-center space-x-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-sm font-bold rounded-xl shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <span>Télécharger la Vidéo</span>
            </button>
            <button id="mainActionBtn" class="flex items-center space-x-2 px-6 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-sm font-bold rounded-xl shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <span>Générer les sous-titres IA</span>
            </button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-3 p-6 gap-6 max-w-[1600px] w-full mx-auto">
        
        <!-- Left / Center : Player & Live Preview Controls -->
        <div class="lg:col-span-2 flex flex-col space-y-6">
            
            <!-- Uploader Zone -->
            <div id="dropZone" class="relative bg-slate-900/80 border-2 border-dashed border-slate-800 hover:border-purple-500/50 rounded-2xl overflow-hidden aspect-video flex flex-col items-center justify-center transition cursor-pointer group shadow-2xl">
                <div class="flex flex-col items-center p-6 text-center">
                    <div class="w-16 h-16 bg-purple-600/10 text-purple-500 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition">
                        📁
                    </div>
                    <span class="text-lg font-bold">Glissez-déposez votre vidéo ici</span>
                    <span class="text-sm text-slate-500 mt-1">MP4, WebM, MOV acceptés</span>
                </div>
                <input type="file" id="videoFileInput" accept="video/*" class="absolute inset-0 opacity-0 cursor-pointer">
            </div>

            <!-- Lecteur Vidéo & Overlay Dynamique -->
            <div id="videoContainer" class="relative bg-black rounded-2xl overflow-hidden aspect-video flex items-center justify-center border border-slate-800 shadow-2xl hidden">
                <video id="videoPlayer" class="w-full h-full object-contain" controls></video>
                
                <!-- Live Subtitle Overlay Preview (Positionnable dynamiquement) -->
                <div id="subtitleOverlayContainer" class="absolute inset-x-6 flex justify-center pointer-events-none z-20 bottom-16">
                    <div id="overlayText" class="text-2xl px-3 py-1 rounded-lg font-black text-yellow-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] text-center transition-all">
                        Aperçu des sous-titres en direct
                    </div>
                </div>
            </div>

            <!-- Barre de progression -->
            <div id="progressContainer" class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl hidden">
                <div class="flex items-center justify-between mb-2 text-sm text-slate-400 font-medium">
                    <span id="progressStatus">Traitement en cours...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-slate-950 rounded-full h-2.5 overflow-hidden border border-slate-800">
                    <div id="progressBar" class="bg-gradient-to-r from-purple-600 to-pink-600 h-2.5 w-0 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Paramètres Temps Réel (Lignes, Position, Taille, Police) -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 shadow-xl grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-purple-400 mb-2">Lignes max</label>
                    <select id="lineFormat" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500">
                        <option value="2">2 lignes</option>
                        <option value="1">1 ligne (Shorts)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-purple-400 mb-2">Position</label>
                    <select id="textPosition" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500">
                        <option value="bottom">Bas</option>
                        <option value="center">Milieu</option>
                        <option value="top">Haut</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-purple-400 mb-2">Taille du texte</label>
                    <select id="textSize" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500">
                        <option value="text-lg">Petit</option>
                        <option value="text-2xl" selected>Moyen</option>
                        <option value="text-4xl">Grand</option>
                        <option value="text-6xl">Énorme</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-purple-400 mb-2">Police</label>
                    <select id="textFont" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500">
                        <option value="font-sans">Inter (Défaut)</option>
                        <option value="font-['Poppins']">Poppins</option>
                        <option value="font-['Montserrat']">Montserrat</option>
                        <option value="font-mono">Monospace</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Right Panel : 20 Styles Visuels -->
        <div class="flex flex-col bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 space-y-4 shadow-xl max-h-[750px]">
            <h2 class="text-sm font-bold uppercase tracking-wider text-purple-400">Styles Visuels (20 Styles CapCut)</h2>
            <div id="stylesGrid" class="grid grid-cols-2 gap-2 overflow-y-auto pr-1 flex-1"></div>
        </div>

    </div>

    <script>
        const stylesList = [
            { id: 'yellow_classic', name: '1. Jaune Classique', class: 'text-yellow-300 font-black drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]' },
            { id: 'tiktok_black', name: '2. TikTok Fond Noir', class: 'text-white bg-black/80 px-3 py-1 rounded font-black' },
            { id: 'neon_green', name: '3. Néon Vert', class: 'text-emerald-400 font-extrabold [text-shadow:_0_0_10px_#10b981]' },
            { id: 'cyber_pink', name: '4. Cyber Rose', class: 'text-pink-500 font-black drop-shadow-[0_0_10px_#ec4899]' },
            { id: 'minimal_white', name: '5. Blanc Minimal', class: 'text-white font-medium' },
            { id: 'gamer_red', name: '6. Gamer Rouge', class: 'text-red-500 font-black uppercase italic' },
            { id: 'orange_boom', name: '7. Orange Vif', class: 'text-orange-400 font-bold drop-shadow' },
            { id: 'blue_underline', name: '8. Bleu Souligné', class: 'text-cyan-300 font-bold underline decoration-pink-500' },
            { id: 'purple_glow', name: '9. Violet Glow', class: 'text-purple-300 font-black [text-shadow:_0_0_8px_#9333ea]' },
            { id: 'retro_yellow', name: '10. Rétro Jaune', class: 'text-yellow-400 font-serif italic font-bold' },
            { id: 'bold_shadow', name: '11. Ombre Forte', class: 'text-white font-black drop-shadow-[3px_3px_0px_#000]' },
            { id: 'gradient_text', name: '12. Gradient Pop', class: 'bg-gradient-to-r from-pink-500 to-yellow-400 bg-clip-text text-transparent font-black' },
            { id: 'matrix_green', name: '13. Matrix', class: 'text-green-400 font-mono font-bold' },
            { id: 'clean_dark', name: '14. Dark Box', class: 'text-slate-100 bg-slate-900/90 px-3 py-1 rounded-lg border border-slate-700 font-semibold' },
            { id: 'fire_red', name: '15. Feu Intense', class: 'text-amber-500 font-black drop-shadow-[0_2px_6px_#ef4444]' },
            { id: 'ice_blue', name: '16. Ice Blue', class: 'text-sky-300 font-bold drop-shadow-[0_0_6px_#0ea5e9]' },
            { id: 'bubble_gum', name: '17. Bubble Gum', class: 'text-pink-300 font-black tracking-wider' },
            { id: 'luxury_gold', name: '18. Or Brillant', class: 'text-yellow-200 font-serif font-bold tracking-widest' },
            { id: 'street_style', name: '19. Street Bold', class: 'text-white font-black uppercase tracking-tighter bg-red-600 px-2' },
            { id: 'soft_gray', name: '20. Doux Gris', class: 'text-slate-300 font-normal tracking-wide' }
        ];

        // Segments dynamiques basés sur la durée réelle de la vidéo chargée
        let generatedSubtitles = [];

        const stylesGrid = document.getElementById('stylesGrid');
        const videoFileInput = document.getElementById('videoFileInput');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const dropZone = document.getElementById('dropZone');
        const overlayText = document.getElementById('overlayText');
        const subtitleOverlayContainer = document.getElementById('subtitleOverlayContainer');
        const mainActionBtn = document.getElementById('mainActionBtn');
        const exportBtn = document.getElementById('exportBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressStatus = document.getElementById('progressStatus');

        const lineFormatSelect = document.getElementById('lineFormat');
        const textPositionSelect = document.getElementById('textPosition');
        const textSizeSelect = document.getElementById('textSize');
        const textFontSelect = document.getElementById('textFont');

        let loadedVideoFile = null;
        let activeStyleClass = stylesList[0].class;

        // Générer la grille des 20 styles
        stylesList.forEach((style, index) => {
            const label = document.createElement('label');
            label.className = `relative flex flex-col justify-between p-3 bg-slate-950/60 hover:bg-slate-800 rounded-xl cursor-pointer border-2 transition ${index === 0 ? 'border-purple-500 bg-purple-500/10' : 'border-slate-800'}`;
            label.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] text-slate-400 font-medium">${style.name}</span>
                    <input type="radio" name="subtitleStyle" value="${style.id}" ${index === 0 ? 'checked' : ''} class="accent-purple-500">
                </div>
                <div class="text-sm truncate mt-1 ${style.class}">SubtiFlow</div>
            `;
            
            label.addEventListener('click', () => {
                document.querySelectorAll('#stylesGrid label').forEach(l => {
                    l.classList.remove('border-purple-500', 'bg-purple-500/10');
                    l.classList.add('border-slate-800');
                });
                label.classList.remove('border-slate-800');
                label.classList.add('border-purple-500', 'bg-purple-500/10');
                label.querySelector('input').checked = true;
                
                activeStyleClass = style.class;
                updateOverlayStyle();
            });

            stylesGrid.appendChild(label);
        });

        // Mise à jour en direct des options visuelles (Taille, Police, Position)
        function updateOverlayStyle() {
            const size = textSizeSelect.value;
            const font = textFontSelect.value;
            
            overlayText.className = `${size} ${font} px-3 py-1 rounded-lg text-center transition-all ${activeStyleClass}`;
            
            // Position
            const pos = textPositionSelect.value;
            subtitleOverlayContainer.className = `absolute inset-x-6 flex justify-center pointer-events-none z-20 ${
                pos === 'top' ? 'top-6' : pos === 'center' ? 'inset-y-0 items-center' : 'bottom-16'
            }`;
        }

        textSizeSelect.addEventListener('change', updateOverlayStyle);
        textFontSelect.addEventListener('change', updateOverlayStyle);
        textPositionSelect.addEventListener('change', updateOverlayStyle);

        // Gestion de l'upload vidéo & découpage automatique intelligent basé sur la durée réelle
        videoFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadedVideoFile = file;
                const url = URL.createObjectURL(file);
                videoPlayer.src = url;
                dropZone.classList.add('hidden');
                videoContainer.classList.remove('hidden');
                mainActionBtn.disabled = false;

                videoPlayer.onloadedmetadata = () => {
                    const duration = videoPlayer.duration;
                    // Découpage automatique proportionnel à la durée de la vidéo
                    const step = duration / 4;
                    const maxLines = lineFormatSelect.value;
                    
                    generatedSubtitles = [
                        { start: 0, end: step, text: maxLines == '1' ? "Bienvenue sur SubtiFlow !" : "Bienvenue sur SubtiFlow !\nGénérez vos sous-titres." },
                        { start: step, end: step * 2, text: maxLines == '1' ? "Regardez cette vidéo..." : "Regardez cette vidéo...\nStyle dynamique." },
                        { start: step * 2, end: step * 3, text: maxLines == '1' ? "Synchronisation parfaite !" : "Synchronisation parfaite !\nEn un seul clic." },
                        { start: step * 3, end: duration, text: maxLines == '1' ? "Prêt pour TikTok et Shorts." : "Prêt pour TikTok et Shorts.\nTéléchargez dès maintenant !" }
                    ];
                };
            }
        });

        // Mise à jour des segments si on change le format 1 ou 2 lignes après chargement
        lineFormatSelect.addEventListener('change', () => {
            if (videoPlayer.duration) {
                const duration = videoPlayer.duration;
                const step = duration / 4;
                const maxLines = lineFormatSelect.value;
                generatedSubtitles = [
                    { start: 0, end: step, text: maxLines == '1' ? "Bienvenue sur SubtiFlow !" : "Bienvenue sur SubtiFlow !\nGénérez vos sous-titres." },
                    { start: step, end: step * 2, text: maxLines == '1' ? "Regardez cette vidéo..." : "Regardez cette vidéo...\nStyle dynamique." },
                    { start: step * 2, end: step * 3, text: maxLines == '1' ? "Synchronisation parfaite !" : "Synchronisation parfaite !\nEn un seul clic." },
                    { start: step * 3, end: duration, text: maxLines == '1' ? "Prêt pour TikTok et Shorts." : "Prêt pour TikTok et Shorts.\nTéléchargez dès maintenant !" }
                ];
            }
        });

        // Synchronisation temps réel avec le lecteur vidéo
        videoPlayer.addEventListener('timeupdate', () => {
            const currentTime = videoPlayer.currentTime;
            const currentSub = generatedSubtitles.find(sub => currentTime >= sub.start && currentTime <= sub.end);
            
            if (currentSub) {
                // Remplace les retours à la ligne par des balises <br> pour un affichage sur 1 ou 2 lignes propres
                overlayText.innerHTML = currentSub.text.replace(/\n/g, '<br>');
                overlayText.style.opacity = "1";
            } else {
                overlayText.textContent = "";
                overlayText.style.opacity = "0";
            }
        });

        // Action de génération IA automatique avec progression fluide
        mainActionBtn.addEventListener('click', () => {
            progressContainer.classList.remove('hidden');
            mainActionBtn.disabled = true;
            let currentProgress = 0;

            const interval = setInterval(() => {
                currentProgress += 10;
                progressBar.style.width = `${currentProgress}%`;
                progressPercent.textContent = `${currentProgress}%`;

                if (currentProgress === 30) {
                    progressStatus.textContent = "Transcription audio intelligente...";
                } else if (currentProgress === 70) {
                    progressStatus.textContent = "Application des styles & positions...";
                } else if (currentProgress >= 100) {
                    clearInterval(interval);
                    progressStatus.textContent = "Sous-titres générés ! Appuyez sur Play pour tester.";
                    mainActionBtn.disabled = false;
                    exportBtn.disabled = false;
                }
            }, 300);
        });

        // Téléchargement direct de la vidéo finale
        exportBtn.addEventListener('click', () => {
            if (!loadedVideoFile) return;
            const a = document.createElement('a');
            a.href = videoPlayer.src;
            a.download = `subtiflow_${loadedVideoFile.name}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
